name: ytdownloader
description: "YouTubex - High Quality YouTube Video and Audio Downloader for Android"
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_riverpod: ^2.5.1
  dio: ^5.7.0
  youtube_explode_dart: ^2.2.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  flutter_local_notifications: ^17.2.2
  open_filex: ^4.5.0
  share_plus: ^10.0.2
  cached_network_image: ^3.4.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
